# Builds the Mac app and publishes it as a GitHub Release whenever a version
# tag is pushed:   git tag v1.0.1 && git push origin v1.0.1
name: Build & release Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14            # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^APP_VERSION *= *"\([^"]*\)".*/\1/p' test_tracker.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match APP_VERSION = \"$version\" in test_tracker.py. Update one so they match."
            exit 1
          fi

      - name: Read release channel
        id: channel
        run: |
          channel="$(sed -n 's/^APP_CHANNEL *= *"\([^"]*\)".*/\1/p' test_tracker.py)"
          echo "testing=$([ "$channel" = "testing" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: ./build_mac.sh

      - name: Zip app
        run: cd dist && ditto -c -k --keepParent "Test Tracker.app" Test-Tracker-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Test-Tracker-mac
          path: dist/Test-Tracker-mac.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Test Tracker ${{ github.ref_name }}${{ steps.channel.outputs.testing == 'true' && ' (testing)' || '' }}
          files: dist/Test-Tracker-mac.zip
          # testing builds are pre-releases: the install line and stable copies' ⬆ Update skip them
          prerelease: ${{ steps.channel.outputs.testing == 'true' }}
          make_latest: ${{ steps.channel.outputs.testing != 'true' }}
          body: |
            ## Install (Apple Silicon Mac, about 2 minutes)

            1. Open **Terminal**: press **⌘ Space**, type `Terminal`, and press **Return**.
            2. Paste this line and press **Return**:
               ```
               curl -fsSL https://raw.githubusercontent.com/shivthakar-vital/test-tracking/main/install.sh | bash
               ```
            3. When it says **✓ Installed**, Test Tracker opens. From then on, open it with **⌘ Space** → `Test Tracker`.
            4. The first time, paste the release's **Google Sheet link**, click **Add**, then **Save**. Ask Shiv for the link and the key file. If you already use Qave Inventory, the key is picked up automatically.

            ## Update

            Already installed? Click the blue **⬆ Update** button in the bottom-right corner of the app. It closes, updates, and reopens by itself. Or run the install line again.

            Full guide and troubleshooting: [INSTALL.md](https://github.com/shivthakar-vital/test-tracking/blob/main/INSTALL.md)
